<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
      
      .pixel-text {
        font-family: 'VT323', 'Courier New', monospace;
      }
      
      .title-glow {
        font-size: 46px;
        font-weight: bold;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      
      .item-glow {
        font-size: 24px;
        letter-spacing: 2px;
        fill: #d5ffff;
      }

      @keyframes crt-flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.95; }
      }
      
      .flicker {
        animation: crt-flicker 0.15s infinite;
      }
    </style>

    <!-- Scanline Pattern -->
    <pattern id="scanlines-edu" width="100" height="4" patternUnits="userSpaceOnUse">
      <rect width="100" height="2" fill="#000000" opacity="0.35" />
    </pattern>

    <!-- CRT Atmosphere Gradient -->
    <radialGradient id="bg-glow-edu" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f453f" stop-opacity="1" />
      <stop offset="45%" stop-color="#062522" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#021210" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#000505" stop-opacity="1" />
    </radialGradient>
    
    <!-- Seamless Edge Vignette -->
    <radialGradient id="vignette-fade-edu" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>
  </defs>

  <!-- Background Layers -->
  <rect width="100%" height="100%" fill="url(#bg-glow-edu)" />
  <rect width="100%" height="100%" fill="url(#scanlines-edu)" />
  <rect width="100%" height="100%" fill="url(#vignette-fade-edu)" />

  <!-- Neon Glow and Text Layers -->
  <g class="pixel-text flicker">
    <!-- Education: (Destacado no mesmo estilo do título) -->
    <text x="60" y="70" class="title-glow" fill="#00e5ff" opacity="0.25" stroke="#00e5ff" stroke-width="12" stroke-linejoin="round">Education:</text>
    <text x="60" y="70" class="title-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="6" stroke-linejoin="round">Education:</text>
    <text x="60" y="70" class="title-glow" fill="#ffffff" stroke="#00ffff" stroke-width="1.8">Education:</text>
    
    <!-- Topic 1 -->
    <g transform="translate(60, 130)">
      <text x="0" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" stroke="#00ffff" stroke-width="1">◆</text>
      
      <text x="25" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">Undergraduate in Information Technology at IMD/UFRN</text>
      <text x="25" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">Undergraduate in Information Technology at IMD/UFRN</text>
      <text x="25" y="0" class="item-glow" fill="#d5ffff" stroke="#00ffff" stroke-width="0.8">Undergraduate in Information Technology at IMD/UFRN</text>
    </g>

    <!-- Topic 2 -->
    <g transform="translate(60, 185)">
      <text x="0" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" stroke="#00ffff" stroke-width="1">◆</text>
      
      <text x="25" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">Bachelor's Degree in Social Science at UFRN</text>
      <text x="25" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">Bachelor's Degree in Social Science at UFRN</text>
      <text x="25" y="0" class="item-glow" fill="#d5ffff" stroke="#00ffff" stroke-width="0.8">Bachelor's Degree in Social Science at UFRN</text>
    </g>

    <!-- Topic 3 -->
    <g transform="translate(60, 240)">
      <text x="0" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" stroke="#00ffff" stroke-width="1">◆</text>
      
      <text x="25" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">Technical Degree in Information Technology at IFRN</text>
      <text x="25" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">Technical Degree in Information Technology at IFRN</text>
      <text x="25" y="0" class="item-glow" fill="#d5ffff" stroke="#00ffff" stroke-width="0.8">Technical Degree in Information Technology at IFRN</text>
    </g>

    <!-- Topic 4 -->
    <g transform="translate(60, 295)">
      <text x="0" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">◆</text>
      <text x="0" y="0" class="item-glow" fill="#00ffff" stroke="#00ffff" stroke-width="1">◆</text>
      
      <text x="25" y="0" class="item-glow" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="8" stroke-linejoin="round">Technical Degree in Web Development at IMDtec (UFRN)</text>
      <text x="25" y="0" class="item-glow" fill="#00ffff" opacity="0.5" stroke="#00ffff" stroke-width="3" stroke-linejoin="round">Technical Degree in Web Development at IMDtec (UFRN)</text>
      <text x="25" y="0" class="item-glow" fill="#d5ffff" stroke="#00ffff" stroke-width="0.8">Technical Degree in Web Development at IMDtec (UFRN)</text>
    </g>
  </g>
</svg>
